services:
  db:
    image: postgres:16-alpine
    container_name: gardensystem-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gardensystem}
      POSTGRES_USER: ${POSTGRES_USER:-gardensystem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gardensystem}
    ports:
      - "5433:5432"
    volumes:
      - gardensystem-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gardensystem} -d ${POSTGRES_DB:-gardensystem}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: GardenSystem.Api/Dockerfile
    container_name: gardensystem-api
    environment:
      ConnectionStrings__DefaultConnection: ${POSTGRES_CONNECTION_STRING:-Host=db;Port=5432;Database=gardensystem;Username=gardensystem;Password=gardensystem}
      Smtp__Host: mailhog
      Smtp__Port: 1025
      ApiKey__Key: ${API_KEY:-9eVHhevvA+1q+fqj/I7qWrPL0lO0CffVral6EoUg5t0=}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started

  mailhog:
    image: mailhog/mailhog
    container_name: gardensystem-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  rabbitmq:
    build:
      context: ./rabbitmq
      dockerfile: Dockerfile
    container_name: gardensystem-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gardensystem}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-gardensystem}
    ports:
      - "5673:5672"
      - "1884:1883"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  sensor-simulator:
    build:
      context: .
      dockerfile: GardenSystem.SensorSimulator/Dockerfile
    container_name: gardensystem-sensor-simulator
    environment:
      Api__BaseUrl: http://api:8080
      ApiKey__Key: ${API_KEY:-9eVHhevvA+1q+fqj/I7qWrPL0lO0CffVral6EoUg5t0=}
      Mqtt__Host: rabbitmq
      Mqtt__Port: 1883
      Mqtt__Username: ${RABBITMQ_USER:-gardensystem}
      Mqtt__Password: ${RABBITMQ_PASSWORD:-gardensystem}
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  telemetry-consumer:
    build:
      context: .
      dockerfile: GardenSystem.TelemetryConsumer/Dockerfile
    container_name: gardensystem-telemetry-consumer
    environment:
      ConnectionStrings__DefaultConnection: ${POSTGRES_CONNECTION_STRING:-Host=db;Port=5432;Database=gardensystem;Username=gardensystem;Password=gardensystem}
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__Username: ${RABBITMQ_USER:-gardensystem}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-gardensystem}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  gardensystem-postgres-data: